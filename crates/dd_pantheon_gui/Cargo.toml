[package]
name = "dd_pantheon_gui"
version = "0.3.9"
edition = "2024"
license = "MIT"
publish = false
description = "GPUI window for dd_pantheon"

[[bin]]
name = "dd_pantheon-gui"
path = "src/main.rs"

[dependencies]
dd_pantheon = { path = "../.." }
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Linux windows need a backend. wayland and x11 are off by default.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "wayland",
    "x11",
] }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.12" }
gpui-component = "=0.9.1"
ldnddev_theme = { path = "../ldnddev_theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tempfile = "3"
