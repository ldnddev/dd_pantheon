[package]
name = "dd_pantheon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Guided operations cockpit for Pantheon sites (Terminus + Lando)"

[dependencies]
anyhow = "1"
crossterm = "0.29"
dirs = "5"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shlex = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
which = "7"
