[package]
name = "dd_pantheon"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Guided operations cockpit for Pantheon sites (Terminus + Lando)"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
crossterm = "0.29"
dirs = "5"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
shlex = "1"
thiserror = "2"
toml = "0.8"
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
which = "7"
