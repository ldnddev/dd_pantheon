name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.1). Required when not pushing a tag."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if ! printf '%s\n' "${TAG_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$'; then
            echo "Refusing to package from '${TAG_NAME}'. Push a vX.Y.Z tag or pass tag=vX.Y.Z."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }} -p dd_pantheon

      - name: Package
        run: |
          set -euo pipefail
          stem="dd_pantheon-${TAG_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/dd_pantheon"
          test -x "$bin"
          strip "$bin" || true
          mkdir -p "$stem"
          cp "$bin" "$stem/dd_pantheon"
          cp dd_pantheon_theme.yml LICENSE "$stem/"
          tar -czf "${stem}.tar.gz" "$stem"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${stem}.tar.gz" > "${stem}.tar.gz.sha256"
          else
            shasum -a 256 "${stem}.tar.gz" > "${stem}.tar.gz.sha256"
          fi
          ls -l "${stem}.tar.gz" "${stem}.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dd_pantheon-*.tar.gz
            dd_pantheon-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List packages
        run: ls -l dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
